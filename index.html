<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>PUS TEST</title>
<style>
  @page { size: A4 portrait; margin: 20mm 15mm 20mm 15mm; }
  * { box-sizing: border-box; transition: all 0.2s ease; }
  
  body { font-family: "Malgun Gothic","Apple SD Gothic Neo",sans-serif; background:#f0f4f8; margin:0; padding:0; color: #2d3748; }

  /* ═══════════ 로그인 화면 구조 ═══════════ */
  .login-wrapper { display: flex; justify-content: center; align-items: center; min-height: 100vh; background: linear-gradient(135deg, #1a2a50 0%, #2d3748 100%); padding: 20px; }
  .login-container { width: 100%; max-width: 380px; background: #fff; padding: 40px 30px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.25); text-align: center; }
  .login-container h2 { margin-top: 0; color: #1a2a50; margin-bottom: 30px; font-size: 24px; font-weight: 800; letter-spacing: -0.5px; }
  .form-group { margin-bottom: 20px; display: flex; flex-direction: column; gap: 8px; }
  
  .form-group label { font-size: 14px; font-weight: 800; color: #4a5568; letter-spacing: 0.5px; text-align: center; }
  .login-input { border: 2px solid #e2e8f0; border-radius: 8px; padding: 12px; font-size: 15px; outline: none; background: #f8fafc; text-align: center; width: 100%; }
  .login-input:focus { border-color: #1a4fb4; background: #fff; box-shadow: 0 0 0 3px rgba(26,79,180,0.15); }
  .login-btn { width: 100%; padding: 14px; background: #1a4fb4; color: #fff; border: none; border-radius: 8px; font-size: 16px; font-weight: 700; cursor: pointer; margin-top: 15px; box-shadow: 0 4px 12px rgba(26,79,180,0.3); }

  /* 최상단 네비게이션바 */
  .navbar { width: 95%; max-width: 1000px; margin: 25px auto 20px; background: #1a2a50; color: #fff; padding: 16px 24px; border-radius: 12px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 4px 20px rgba(26,42,80,0.15); }
  .navbar .brand { font-size: 18px; font-weight: 800; letter-spacing: 0.5px; }
  .navbar .user-info { font-size: 14px; display: flex; align-items: center; gap: 15px; }
  .logout-btn { background: #e53e3e; color: #fff; border: none; padding: 6px 14px; border-radius: 6px; font-size: 12px; font-weight: 700; cursor: pointer; }

  /* ═══════════ 관리자 페이지 레이아웃 (상하 1열) ═══════════ */
  .admin-panel { width: 95%; max-width: 1000px; margin: 0 auto 25px; background: #fff; border-radius: 14px; overflow: hidden; box-shadow: 0 6px 24px rgba(0,0,0,0.06); border: 1px solid #e2e8f0; }
  .panel-header { color: #fff; padding: 16px 24px; display: flex; align-items: center; justify-content: space-between; background: #1a2a50; }
  .panel-header span { font-size: 16px; font-weight: 800; letter-spacing: 0.5px; }
  .panel-body { padding: 25px; display: flex; flex-direction: column; gap: 25px; }

  .sub-card { background: #fff; border: 1px solid #e2e8f0; border-radius: 12px; padding: 20px; box-shadow: 0 2px 12px rgba(0,0,0,0.02); width: 100%; }
  .sub-card h3 { margin-top: 0; font-size: 15px; color: #1a2a50; border-bottom: 2px solid #edf2f7; padding-bottom: 10px; margin-bottom: 16px; font-weight: 800; }
  
  .admin-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .admin-table th, .admin-table td { border-bottom: 1px solid #edf2f7; padding: 10px 12px; text-align: center; }
  .admin-table th { background: #f8fafc; color: #4a5568; font-weight: 800; border-top: 1px solid #edf2f7; }
  .clickable-title { color: #1a4fb4; font-weight: 800; cursor: pointer; text-decoration: none; }
  .clickable-title:hover { text-decoration: underline; color: #6b35a8; }
  
  /* 파일 업로드 */
  .file-upload-box { width: 100%; background: #ebf8ff; border: 2px dashed #3182ce; padding: 12px 20px; border-radius: 12px; display: flex; align-items: center; justify-content: flex-start; gap: 8px; }
  .file-upload-box label { font-size: 14px; font-weight: 800; color: #2b6cb0; margin: 0; padding: 0; white-space: nowrap; }
  .file-upload-box input[type="file"] { font-size: 13px; color: #4a5568; cursor: pointer; margin: 0; padding: 0; display: inline-block; }

  /* 에디터 구조 */
  .q-editor-list { display: flex; flex-direction: column; gap: 14px; max-height: 500px; overflow-y: auto; padding-right: 5px; }
  .q-editor { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 10px; padding: 16px; }
  .q-editor-header { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  .q-editor-num { background: #6b35a8; color: #fff; font-size: 11px; font-weight: 800; padding: 3px 8px; border-radius: 4px; }
  .del-q-btn { margin-left: auto; background: #e53e3e; color: #fff; border: none; border-radius: 4px; font-size: 12px; padding: 4px 10px; cursor: pointer; }
  .q-editor textarea, .q-editor input[type=text] { width: 100%; border: 1.5px solid #cbd5e0; border-radius: 6px; padding: 8px 12px; font-size: 13px; outline: none; background: #fff; }
  .q-editor label.small { font-size: 11px; font-weight: bold; color: #4a5568; display: block; margin-top: 8px; margin-bottom: 4px; }

  .history-badge { display: inline-block; font-size: 11px; color: #4a5568; background: #edf2f7; padding: 3px 8px; border-radius: 4px; max-width: 250px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: bold; }

  /* 문항 에디터 버튼/레이아웃 */
  .add-q-btn { background: #2f855a; color: #fff; border: none; border-radius: 6px; padding: 7px 14px; font-size: 13px; font-weight: 700; cursor: pointer; margin-right: 6px; }
  .add-q-btn:hover { background: #276749; }
  .add-opt-btn { background: #3182ce; color: #fff; border: none; border-radius: 4px; padding: 4px 10px; font-size: 12px; font-weight: 700; cursor: pointer; margin-top: 6px; }
  .opts-editor { display: flex; flex-direction: column; gap: 5px; margin: 6px 0; }
  .opt-row { display: flex; align-items: center; gap: 6px; }
  .opt-row span { font-size: 13px; font-weight: bold; color: #4a5568; min-width: 20px; }
  .opt-row input[type=text] { flex: 1; border: 1.5px solid #cbd5e0; border-radius: 4px; padding: 4px 8px; font-size: 13px; outline: none; }
  .q-editor textarea { width: 100%; border: 1.5px solid #cbd5e0; border-radius: 6px; padding: 8px 12px; font-size: 13px; outline: none; background: #fff; resize: vertical; }

  /* 직원 대시보드 */
  .user-dashboard { width: 95%; max-width: 1000px; margin: 0 auto 25px; background: #fff; padding: 25px; border-radius: 14px; box-shadow: 0 6px 24px rgba(0,0,0,0.06); border: 1px solid #e2e8f0; }
  .user-dashboard h2 { margin-top: 0; color: #1a2a50; border-bottom: 2px solid #1a4fb4; padding-bottom: 12px; font-size: 20px; font-weight: 800; }
  .exam-list-table { width: 100%; border-collapse: collapse; margin-top: 15px; }
  .exam-list-table th, .exam-list-table td { border-bottom: 1px solid #edf2f7; padding: 14px 10px; text-align: center; font-size: 14px; }
  .exam-list-table th { background: #f8fafc; font-weight: 800; color: #4a5568; }
  .start-exam-btn { padding: 8px 18px; background: #1a4fb4; color:#fff; border:none; border-radius:6px; font-weight:700; cursor:pointer; }

  /* 제어바 */
  .controlbar { width: 95%; max-width: 1000px; margin: 0 auto 20px; display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; }
  #gradeBtn { padding: 14px 30px; font-size: 15px; font-weight: 700; border-radius: 8px; border: none; cursor: pointer; background: #1a4fb4; color: #fff; }
  #submitBtn { padding: 14px 30px; font-size: 15px; font-weight: 700; border-radius: 8px; border: none; cursor: pointer; background: #2f855a; color: #fff; }
  #backListBtn { padding: 14px 20px; font-size: 15px; font-weight: 700; border-radius: 8px; border: 2px solid #4a5568; background: #fff; color: #4a5568; cursor: pointer; }

  .mobile-nav-bar { display: none; width: 100%; max-width: 1000px; margin: 0 auto 15px; justify-content: space-between; align-items: center; gap: 10px; padding: 0 10px; }
  .mob-nav-btn { flex: 1; padding: 12px; background: #4a5568; color: #fff; border: none; border-radius: 8px; font-weight: bold; font-size: 14px; cursor: pointer; }
  .mob-nav-btn:disabled { background: #cbd5e0; cursor: not-allowed; }
  .mob-page-indicator { font-size: 14px; font-weight: 800; color: #1a2a50; background: #fff; padding: 10px 16px; border-radius: 8px; border: 1px solid #cbd5e0; white-space: nowrap; }

  .scorebox { width: 95%; max-width: 1000px; margin: 0 auto 20px; text-align: center; font-size: 18px; font-weight: 800; padding: 20px; border-radius: 12px; display: none; }
  .scorebox.pass { background: #f0fff4; color: #22543d; border: 2px solid #38a169; }
  .scorebox.fail { background: #fff5f5; color: #742a2a; border: 2px solid #e53e3e; }

  /* 시험지 양식 */
  .sheet { width: 95%; max-width: 1000px; margin: 0 auto 40px; background: #fff; border: 3px solid #1a2a50; padding: 40px 45px; display: none; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); }
  .header-row { display: flex; align-items: flex-end; border-bottom: 4px solid #1a4fb4; padding-bottom: 12px; margin-bottom: 20px; }
  .title { font-size: 24px; font-weight: 900; letter-spacing: 1px; color: #1a2a50; }
  
  table.info { width: 100%; border-collapse: collapse; margin-bottom: 20px; font-size: 14px; table-layout: fixed; }
  table.info td { border: 2px solid #1a2a50; padding: 6px 10px; height: 34px; vertical-align: middle; }
  table.info td.label { background: #f8fafc; font-weight: 800; width: 110px; text-align: center; color: #1a2a50; }
  
  .infoInput { width: 100%; border: none; font-size: 14px; padding: 2px; outline: none; background: #fffbe6; border-radius: 4px; }
  .notice { background: #f8fafc; border-left: 5px solid #1a4fb4; padding: 14px 20px; font-size: 14px; line-height: 1.8; margin-bottom: 24px; font-weight: 700; color: #4a5568; }
  .columns { display: flex; border-top: 2px solid #1a4fb4; padding-top: 25px; }
  .col { flex: 1; min-width: 0; padding: 0 20px; }
  .col:first-child { border-right: 2px solid #e2e8f0; padding-left: 0; }
  .col:last-child { padding-right: 0; }
  
  .q { margin-bottom: 30px; page-break-inside: avoid; background: #fff; border-radius: 8px; }
  .q-text { font-size: 15px; font-weight: 700; margin-bottom: 12px; line-height: 1.6; color: #111; display: flex; align-items: flex-start; gap: 8px; }
  .q-num { background: #1a4fb4; color: #fff; font-size: 12px; font-weight: 800; padding: 2px 8px; border-radius: 4px; margin-top: 2px; flex-shrink: 0; }
  .choice-box { border: 1.5px solid #b0bddf; border-radius: 8px; background: #f4f7ff; padding: 12px 16px; font-size: 13.5px; line-height: 1.8; margin-bottom: 12px; color: #2d3748; font-weight: bold; }
  .opt { display: flex; align-items: flex-start; gap: 8px; font-size: 14.5px; margin: 6px 0; cursor: pointer; padding: 6px 10px; border-radius: 6px; }
  .opt:hover { background: #f1f5f9; }
  .opt input[type=checkbox] { width: 16px; height: 16px; margin-top: 3px; accent-color: #1a4fb4; flex-shrink: 0; cursor: pointer; }
  .opt span.num { width: 22px; color: #4a5568; font-weight: 700; flex-shrink: 0; }
  .opt.correct-mark { background: #c6f6d5 !important; color: #22543d; font-weight: 700; }
  .opt.wrong-mark { background: #fed7d7 !important; color: #742a2a; }
  
  .blankbox { border: 1.5px solid #cbd5e0; border-radius: 8px; padding: 12px 16px; font-size: 14.5px; margin-top: 8px; background: #fff; line-height: 1.8; }
  .blankbox input[type=text], .shortanswer input[type=text] { border: none; border-bottom: 2px solid #a0aec0; font-size: 14.5px; padding: 2px 8px; outline: none; background: #fffbe6; width: 150px; }
  .shortanswer { border: 1.5px solid #cbd5e0; border-radius: 8px; padding: 12px; background: #fff; margin-top: 8px; }
  .shortanswer input[type=text] { width: 100%; }
  
  .result-icon { font-size: 12px; font-weight: 800; margin-left: 8px; padding: 2px 8px; border-radius: 4px; display: inline-block; }
  .result-icon.ok { color: #22543d; background: #c6f6d5; }
  .result-icon.no { color: #742a2a; background: #fed7d7; }
  .answer-reveal { margin-top: 8px; font-size: 13.5px; color: #1a4fb4; font-weight: 700; background: #ebf8ff; padding: 6px 12px; border-radius: 6px; display: none; }
  .answer-reveal.show { display: block; }
  .endmsg { text-align: center; margin-top: 25px; font-size: 15px; font-weight: 800; color: #718096; letter-spacing: 2px; }

  /* 모달 레이아웃 */
  .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); display: none; justify-content: center; align-items: center; z-index: 1000; padding: 10px; }
  .modal-content { background: #fff; border-radius: 16px; width: 920px; max-height: 85%; overflow-y: auto; padding: 25px; box-shadow: 0 20px 40px rgba(0,0,0,0.3); position: relative; }
  .close-modal { position: absolute; top: 15px; right: 20px; font-size: 28px; font-weight: bold; cursor: pointer; color: #a0aec0; }
  .close-modal:hover { color: #2d3748; }

  @media (max-width: 768px) {
    .navbar { flex-direction: column; gap: 10px; text-align: center; margin: 10px auto; padding: 12px; }
    .navbar .user-info { flex-direction: column; gap: 8px; }
    .file-upload-box { flex-direction: column; align-items: flex-start; padding: 12px; }
    .sheet { padding: 20px 15px; border-width: 2px; }
    table.info td { padding: 4px 6px; font-size: 12px; height: auto; }
    table.info td.label { width: 75px; }
    .columns { flex-direction: column; padding-top: 15px; }
    .col { padding: 0 !important; border: none !important; }
    .sheet .q { display: none; background: #f8fafc; border: 1px solid #e2e8f0; padding: 15px; border-radius: 12px; margin-bottom: 15px; }
    .sheet .q.active-mobile-q { display: block !important; }
    .opt { font-size: 13.5px; padding: 8px; background: #fff; border: 1px solid #edf2f7; margin: 6px 0; }
  }

  @media print {
    body { background: #fff; padding: 0; margin: 0; color: #000; }
    .navbar, .admin-panel, .controlbar, .scorebox, .user-dashboard, .logout-btn, .modal-overlay, .file-upload-box, .mobile-nav-bar { display: none !important; }
    .sheet { border: none !important; margin: 0 auto !important; padding: 0 !important; width: 700px !important; display: block !important; box-shadow: none !important; }
    .sheet .q { display: block !important; margin-bottom: 22px !important; }
  }
</style>
</head>
<body>

<div class="login-wrapper" id="loginWrapper">
  <div class="login-container" id="loginGate">
    <h2>PUSTEST</h2>
    <div class="form-group">
      <label>ID</label>
      <input type="text" id="loginId" class="login-input" placeholder="이름 또는 ID 입력" onkeydown="if(event.key==='Enter')executeLogin()">
    </div>
    <div class="form-group">
      <label>PW</label>
      <input type="password" id="loginPw" class="login-input" placeholder="비밀번호 입력" onkeydown="if(event.key==='Enter')executeLogin()">
    </div>
    <button class="login-btn" onclick="executeLogin()">로그인</button>
  </div>
</div>

<div class="navbar" id="topNavbar" style="display: none;">
  <div class="brand">✈ PUS TEST</div>
  <div class="user-info">
    <span id="welcomeMsg"></span>
    <button class="logout-btn" onclick="executeLogout()">로그아웃</button>
  </div>
</div>

<div class="admin-panel" id="adminMainPage" style="display: none;">
  <div class="panel-header"><span>🛠️ 관리자 모드</span></div>
  <div class="panel-body">
    
    <div class="file-upload-box">
      <label>📂 파일 업로드:</label><input type="file" id="htmlUploader" accept=".html" onchange="importExamFromFile()">
    </div>

    <div class="sub-card">
      <h3>👥 명단 관리</h3>
      <div style="display:flex; gap:8px; margin-bottom:14px; max-width: 500px;">
        <input type="text" id="newEmpName" placeholder="신규 사원 이름 입력" style="flex:1; padding:10px; border:1px solid #cbd5e0; border-radius:6px; font-size:13px;">
        <button onclick="addEmployee()" style="background:#1a4fb4; color:#fff; border:none; border-radius:6px; padding:0 20px; font-size:13px; font-weight:700; cursor:pointer;">추가</button>
      </div>
      <div style="max-height:260px; overflow-y:auto;">
        <table class="admin-table">
          <thead>
            <tr><th style="width:20%;">사원명</th><th style="width:20%;">비밀번호</th><th style="width:30%;">전송 내역</th><th style="width:30%;">지정 작업</th></tr>
          </thead>
          <tbody id="empTableBody"></tbody>
        </table>
      </div>
    </div>

    <div class="sub-card">
      <h3>📋 시험지 저장 <small style="font-weight:normal;color:#718096;margin-left:4px;">(명칭 클릭 시 미리보기)</small></h3>
      <div style="display:flex; gap:8px; margin-bottom:14px; max-width: 500px;">
        <input type="text" id="newExamTitle" placeholder="신규 시험지 명칭 입력" style="flex:1; padding:10px; border:1px solid #cbd5e0; border-radius:6px; font-size:13px;">
        <button onclick="createNewExamTemplate()" style="background:#2f855a; color:#fff; border:none; border-radius:6px; padding:0 20px; font-size:13px; font-weight:700; cursor:pointer;">저장</button>
      </div>
      <div style="max-height:240px; overflow-y:auto;">
        <table class="admin-table">
          <thead>
            <tr><th style="width:65%;">시험지 명칭</th><th style="width:15%;">문항수</th><th style="width:20%;">관리</th></tr>
          </thead>
          <tbody id="examTemplatesTbody"></tbody>
        </table>
      </div>
    </div>

    <div class="sub-card" id="editorContainerCard" style="display:none; border:2px dashed #6b35a8;">
      <h3><span id="editingTitleLabel">시험지 문항 조율</span>
        <button onclick="closeEditor()" style="background:#4a5568; color:#fff; border:none; padding:4px 10px; border-radius:4px; font-size:12px; cursor:pointer; float:right;">편집창 닫기</button>
      </h3>
      <div class="q-editor-list" id="qEditorList"></div>
      <div style="display:flex; justify-content:space-between; align-items:center; margin-top:16px; border-top:1px solid #edf2f7; padding-top:14px;">
        <div>
          <button class="add-q-btn" onclick="addQuestion('mc')">＋ 객관식 추가</button>
          <button class="add-q-btn" onclick="addQuestion('text')">＋ 주관식 추가</button>
          <button class="add-q-btn" onclick="addQuestion('blank1')">＋ 빈칸형 추가</button>
        </div>
        <button onclick="saveActiveQuestions()" style="background:#6b35a8; color:#fff; border:none; font-weight:800; border-radius:8px; padding:10px 28px; cursor:pointer; font-size:14px;">💾 최종 변경사항 저장</button>
      </div>
    </div>

    <div class="sub-card">
      <h3>📊 제출 결과</h3>
      <div style="max-height:300px; overflow-y:auto;">
        <table class="admin-table">
          <thead>
            <tr><th style="width:20%;">응시 사원</th><th style="width:45%;">시험지명</th><th style="width:15%;">확인 점수</th><th style="width:10%;">판정</th><th style="width:10%;">관리</th></tr>
          </thead>
          <tbody id="resultsTableBody"></tbody>
        </table>
      </div>
    </div>

  </div>
</div>

<div class="user-dashboard" id="userMainPage" style="display: none;">
  <h2>📥 시험지 목록</h2>
  <div style="overflow-x: auto;">
    <table class="exam-list-table">
      <thead>
        <tr><th>시험지</th><th>배점 구조</th><th>현재 진행 상태</th><th>평가 응시</th></tr>
      </thead>
      <tbody id="userExamListBody"></tbody>
    </table>
  </div>
</div>

<div class="mobile-nav-bar" id="mobileNavBar">
  <button class="mob-nav-btn" id="mobPrevBtn" onclick="changeMobileQuestion(-1)">◀ 이전 문제</button>
  <div class="mob-page-indicator" id="mobIndicator">문항 1 / 10</div>
  <button class="mob-nav-btn" id="mobNextBtn" onclick="changeMobileQuestion(1)">다음 문제 ▶</button>
</div>

<div class="controlbar" id="examControlBar" style="display: none;">
  <button id="backListBtn" onclick="abortToDashboard()">◀ 대시보드로 돌아가기</button>
  <button id="gradeBtn" onclick="actionGradeExam()">✔ 마크 채점하기</button>
  <button id="submitBtn" onclick="actionSubmitExam()" disabled>🚀 답안 최종 제출하기</button>
</div>

<div class="scorebox" id="scorebox"></div>

<div class="sheet" id="sheet">
  <div class="header-row"><div class="title" id="sheetExamTitle">PUS TEST</div></div>
  <table class="info">
    <tr>
      <td class="label">소속 정보</td>
      <td><input type="text" class="infoInput" id="dept" placeholder="소속 부서 기입" oninput="saveCurrentProgress()"></td>
      <td class="label">사원 번호</td>

function importExamFromFile() {
  const fileInput = document.getElementById('htmlUploader');
  if (!fileInput.files.length) return;

  const file = fileInput.files[0];
  const reader = new FileReader();

  reader.onload = function(e) {
    const textContent = e.target.result;
    try {
      if (textContent.includes('const DEFAULT_QUESTIONS =')) {
        let startIdx = textContent.indexOf('const DEFAULT_QUESTIONS =');
        let endIdx = textContent.indexOf('];', startIdx);
        let arrayStr = textContent.substring(startIdx + 'const DEFAULT_QUESTIONS ='.length, endIdx + 1).trim();
        let parsedQs;
        try { parsedQs = (new Function('return (' + arrayStr + ')'))(); } catch(e2) { throw new Error('문항 배열 파싱 실패: ' + e2.message); }
        
        if (Array.isArray(parsedQs)) {
          if(textContent.includes('const DEFAULT_ANSWERS =')) {
            let aStart = textContent.indexOf('const DEFAULT_ANSWERS =');
            let aEnd = textContent.indexOf('};', aStart);
            let ansStr = textContent.substring(aStart + 'const DEFAULT_ANSWERS ='.length, aEnd + 1).trim();
            let parsedAns;
            try { parsedAns = (new Function('return (' + ansStr + ')'))(); } catch(e3) { parsedAns = {}; }
            
            parsedQs.forEach(q => {
              if(parsedAns[q.id]) {
                q.correct = parsedAns[q.id].selected || [];
                q.keywords = parsedAns[q.id].keywords || '';
                q.display = parsedAns[q.id].display || '';
              }
              if(q.type === 'mc7') q.type = 'mc';
            });
          }

          const newId = Date.now();
          let pureTitle = file.name.replace('.html', '');
          examTemplates.push({ id: newId, title: pureTitle, questions: parsedQs });
          localStorage.setItem('sms_exams', JSON.stringify(examTemplates));
          alert('마스터 저장소에 적재했습니다.');
          renderAdminDash();
        }
      } else { alert('구조를 찾을 수 없습니다.'); }
    } catch (err) { alert('오류: ' + err.message); }
  };
  reader.readAsText(file, 'UTF-8');
}

function openExamPreviewModal(examId) {
  const template = examTemplates.find(t => String(t.id) === String(examId));
  if(!template || !Array.isArray(template.questions)) return;

  const modalSheet = document.getElementById('modalSheetContents');
  let safeQs = template.questions;
  let totalPoints = safeQs.reduce((sum, q) => sum + (q.points || 10), 0);
  
  let html = `<div style="text-align:center; margin-bottom:15px;"><h2 style="color:#1a2a50; margin:0;">🔍 마스터 미리보기: ${escHtml(template.title)}</h2>
              <span style="font-size:12px; color:#666;">총 문항수: ${safeQs.length}개 | 배점합: ${totalPoints}점</span></div>
              <div style="display:grid; grid-template-columns:1fr 1fr; gap:20px; border-top:2px solid #1a4fb4; padding-top:15px;">`;

  let leftH = '', rightH = '';
  const half = Math.ceil(safeQs.length / 2);

  safeQs.forEach((q, idx) => {
    try {
      let qBlock = `<div style="margin-bottom:20px; border-bottom:1px dashed #ddd; padding-bottom:10px;">
        <div style="font-size:13px; font-weight:bold; margin-bottom:6px;"><span style="background:#6b35a8; color:#fff; padding:1px 5px; border-radius:3px; font-size:11px; margin-right:4px;">${idx+1}</span> ${escHtml(q.text||'문제 텍스트 없음').replace(/\n/g,'<br>')} <span>(${q.points||10}점)</span></div>`;
      
      if (q.choiceBox) {
        qBlock += `<div style="background:#f4f7ff; border:1px solid #b0bddf; padding:8px; font-size:12px; margin-bottom:6px; border-radius:4px;">${escHtml(q.choiceBox).replace(/\n/g,'<br>')}</div>`;
      }
      
      let safeOpts = Array.isArray(q.opts) ? q.opts : [];
      let safeCorrect = Array.isArray(q.correct) ? q.correct : String(q.correct||'').split(',').map(s=>s.trim());

      if((q.type === 'mc' || q.type === 'mc7') && safeOpts.length > 0) {
        safeOpts.forEach((o, i) => {
          let isCorrect = safeCorrect.includes(String(i+1));
          qBlock += `<div style="font-size:12px; padding:2px 6px; ${isCorrect?'background:#e3f5e8; font-weight:bold;':''}"> ${NUMS[i%10]} ${escHtml(o)}</div>`;
        });
      } else {
        qBlock += `<div style="font-size:11px; color:#1a4fb4; font-weight:bold; background:#f4f7ff; padding:6px;">🔑 기준: ${escHtml(q.display || q.keywords || '')}</div>`;
      }
      qBlock += `</div>`;
      if(idx < half) leftH += qBlock; else rightH += qBlock;
    } catch(e) {}
  });

  html += `<div>${leftH}</div><div>${rightH}</div></div>`;
  modalSheet.innerHTML = html;
  document.getElementById('previewModal').style.display = 'flex';
}

function renderQEditorList(qs) {

      let safeOpts = Array.isArray(q.opts) ? q.opts : [];

      if ((q.type === 'mc' || q.type === 'mc7') && safeOpts.length > 0) {
        extra = ``;
        if (q.choiceBox !== undefined) {
          extra += `<label class="small">보기 박스 내용 (줄바꿈 구분)</label>
                    <textarea rows="3" oninput="updateMasterChoiceBox(${idx}, this.value)">${escHtml(q.choiceBox)}</textarea>`;

            ${safeOpts.map((o,i)=>`<div class="opt-row"><span>${NUMS[i%10]}</span><input type="text" value="${escHtml(o)}" oninput="updateMasterOpt(${idx}, ${i}, this.value)"><button onclick="deleteMasterOpt(${idx},${i})" style="color:red;border:none;background:none;cursor:pointer;">✕</button></div>`).join('')}
          </div>
          <button class="add-opt-btn" onclick="addMasterOpt(${idx})">＋ 보기 추가</button>

      } else if (q.type === 'blank1') {
        extra = `<label class="small">빈칸 문장 구성 (( ) 포함)</label>
                 <input type="text" value="${escHtml(q.blankSentence || '')}" oninput="updateMasterBlankSentence(${idx}, this.value)">
                 <label class="small">정답 키워드 (쉼표 구분)</label>
                 <input type="text" value="${escHtml(q.keywords || '')}" oninput="updateMasterKeywords(${idx}, this.value)">`;
      } else {
        extra = `<label class="small">정답 키워드 (쉼표 구분)</label>
                 <input type="text" value="${escHtml(q.keywords || '')}" oninput="updateMasterKeywords(${idx}, this.value)">`;
      }

      div.innerHTML = `<div class="q-editor-header">
          <span class="q-editor-num">${idx+1}번</span>
          <span style="font-size:11px;margin-left:10px;">배점:</span><input type="number" value="${q.points||10}" oninput="updateMasterPoints(${idx}, this.value)" style="width:50px; text-align:center;">
          <button class="del-q-btn" onclick="deleteMasterQuestion(${idx})">삭제</button>
        </div>
        <textarea rows="2" oninput="updateMasterText(${idx}, this.value)">${escHtml(q.text||'')}</textarea>${extra}`;
      list.appendChild(div);
    } catch(e){}
  });
}

function updateMasterText(qIdx, val) { examTemplates.find(t=>String(t.id)===String(activeEditExamId)).questions[qIdx].text = val; }
function updateMasterPoints(qIdx, val) { examTemplates.find(t=>String(t.id)===String(activeEditExamId)).questions[qIdx].points = parseInt(val) || 10; }
function updateMasterOpt(qIdx, oIdx, val) { examTemplates.find(t=>String(t.id)===String(activeEditExamId)).questions[qIdx].opts[oIdx] = val; }
function updateMasterChoiceBox(qIdx, val) { examTemplates.find(t=>String(t.id)===String(activeEditExamId)).questions[qIdx].choiceBox = val; }
function updateMasterBlankSentence(qIdx, val) { examTemplates.find(t=>String(t.id)===String(activeEditExamId)).questions[qIdx].blankSentence = val; }
function updateMasterCorrect(qIdx, val) { examTemplates.find(t=>String(t.id)===String(activeEditExamId)).questions[qIdx].correct = val.split(',').map(s=>s.trim()); }
function updateMasterKeywords(qIdx, val) { examTemplates.find(t=>String(t.id)===String(activeEditExamId)).questions[qIdx].keywords = val; }

function addMasterOpt(qIdx) { 
  const t = examTemplates.find(t=>String(t.id)===String(activeEditExamId));
  if(!Array.isArray(t.questions[qIdx].opts)) t.questions[qIdx].opts = [];
  t.questions[qIdx].opts.push('선택지'); 
  renderQEditorList(t.questions); 
}
function deleteMasterOpt(qIdx, oIdx) { 
  const t = examTemplates.find(t=>String(t.id)===String(activeEditExamId));
  t.questions[qIdx].opts.splice(oIdx,1); 
  renderQEditorList(t.questions); 
}
function deleteMasterQuestion(qIdx) { 
  const t = examTemplates.find(t=>String(t.id)===String(activeEditExamId));
  t.questions.splice(qIdx,1); 
  renderQEditorList(t.questions); 
}

/* 💡 에러 완전 복구: 짤림을 유발하던 빈칸 처리부를 DOM 방식으로 100% 안전하게 주입 */
function renderExamSheetBody(qs) {
  const left = document.getElementById('colLeft'); const right = document.getElementById('colRight');
  left.innerHTML = ''; right.innerHTML = ''; 
  const half = Math.ceil(qs.length / 2);
  
  qs.forEach((q, idx) => {
    try {
      const col = idx < half ? left : right;
      let div = document.createElement('div'); div.className = 'q'; div.dataset.qidx = idx; div.dataset.qid = q.id;
      
      let textHtml = `<div class="q-text"><span class="q-num">${idx+1}</span>${escHtml(q.text||'문제 내용 없음').replace(/\n/g,'<br>')}</div>`;
      if (q.choiceBox) {
        textHtml += `<div class="choice-box">${escHtml(q.choiceBox).replace(/\n/g,'<br>')}</div>`;
      }
      div.innerHTML = textHtml;
      
      let safeOpts = Array.isArray(q.opts) ? q.opts : [];

      // 💡 사용자 데이터 오류 방어 (만약 MC인데 보기가 아예 없는 데이터라면 강제로 텍스트 창으로 띄워서 먹통을 방지함)
      if ((q.type === 'mc' || q.type === 'mc7') && safeOpts.length > 0) {
        safeOpts.forEach((o, i) => { 
          let lbl = document.createElement('label'); lbl.className = 'opt';
          lbl.innerHTML = `<input type="checkbox" name="ans-${idx}" value="${i+1}"><span class="num">${NUMS[i%10]}</span>${escHtml(o)}`;
          lbl.querySelector('input').addEventListener('change', saveCurrentProgress);
          div.appendChild(lbl);
        });
      } else if (q.type === 'blank1' || (q.blankSentence && q.blankSentence.trim() !== '')) {
        let formDiv = document.createElement('div'); formDiv.className = 'blankbox';
        let originSentence = (q.blankSentence || q.text || '');
        if(!originSentence.includes('(') && !originSentence.includes(')')) { originSentence += ' ( )'; }
        
        let safeSentence = escHtml(originSentence).replace(/\n/g, '<br>');
        let finalSentenceHtml = safeSentence.replace(/\(\s*\)/g, `(<input type="text" id="ans-${idx}" placeholder="입력">)`);
        formDiv.innerHTML = finalSentenceHtml;
        
        let inp = formDiv.querySelector('input');
        if(inp) { inp.addEventListener('input', saveCurrentProgress); }
        div.appendChild(formDiv);
      } else {
        // 주관식 및 에러로 보기가 없는 모든 문제는 텍스트 입력창으로 출력
        let formDiv = document.createElement('div'); formDiv.className = 'shortanswer';
        formDiv.innerHTML = `<input type="text" id="ans-${idx}" placeholder="답안 입력">`;
        formDiv.querySelector('input').addEventListener('input', saveCurrentProgress);
        div.appendChild(formDiv);
      }
      
      let revealDiv = document.createElement('div'); revealDiv.className = 'answer-reveal'; revealDiv.id = `reveal-${idx}`;
      div.appendChild(revealDiv);
      col.appendChild(div);
    } catch(e) {
      console.error(e);
    }
  });
}

function saveCurrentProgress() {
  if (isGradedCompleted || !activeTakeAssignId) return;
  const progressData = {
    dept: document.getElementById('dept').value,
    empId: document.getElementById('empId').value,
    answers: {}
  };
  
  document.querySelectorAll('.sheet .q').forEach((qEl) => {
    const idx = qEl.dataset.qidx;
    const checkboxes = qEl.querySelectorAll('input[type=checkbox]');
    if (checkboxes.length > 0) {
      const checkedVals = [...qEl.querySelectorAll('input[type=checkbox]:checked')].map(c => c.value);
      progressData.answers[idx] = checkedVals;
    } else {
      const textVal = qEl.querySelector('input[type=text]')?.value || '';
      progressData.answers[idx] = textVal;
    }
  });
  
  localStorage.setItem('sms_progress_' + activeTakeAssignId, JSON.stringify(progressData));
  checkMobileGradeReadyButton();
}

function restoreSavedProgress() {
  if (!activeTakeAssignId) return;
  const savedDataStr = localStorage.getItem('sms_progress_' + activeTakeAssignId);
  if (!savedDataStr) return;
  
  const progressData = JSON.parse(savedDataStr);
  document.getElementById('dept').value = progressData.dept || '';
  document.getElementById('empId').value = progressData.empId || '';
  
  document.querySelectorAll('.sheet .q').forEach((qEl) => {
    const idx = qEl.dataset.qidx;
    const savedAns = progressData.answers[idx];
    if (savedAns !== undefined) {
      const checkboxes = qEl.querySelectorAll('input[type=checkbox]');
      if (checkboxes.length > 0 && Array.isArray(savedAns)) {
        savedAns.forEach(val => {
          const cb = qEl.querySelector(`input[type=checkbox][value="${val}"]`);
          if(cb) cb.checked = true;
        });
      } else {
        const txtInput = qEl.querySelector('input[type=text]');
        if (txtInput) txtInput.value = savedAns;
      }
    }
  });
  checkMobileGradeReadyButton();
}

function checkMobileGradeReadyButton() {
  const dept = document.getElementById('dept').value.trim();
  const empId = document.getElementById('empId').value.trim();
  if(!dept || !empId) {
    document.getElementById('gradeBtn').disabled = true;
    return;
  }
  let allAnswered = true;
  document.querySelectorAll('.sheet .q').forEach((qEl) => {
    const checkboxes = qEl.querySelectorAll('input[type=checkbox]');
    if (checkboxes.length > 0) {
      const hasCheck = qEl.querySelector('input[type=checkbox]:checked');
      if(!hasCheck) allAnswered = false;
    } else {
      const txt = qEl.querySelector('input[type=text]')?.value.trim();
      if(!txt) allAnswered = false;
    }
  });
  document.getElementById('gradeBtn').disabled = !allAnswered;
}

function updateMobileQuestionVisibility() {
  const isMobile = window.innerWidth <= 768;
  const navBar = document.getElementById('mobileNavBar');
  
  if (isMobile && !isGradedCompleted) {
    navBar.style.display = 'flex';
    document.getElementById('mobIndicator').textContent = `문항 ${mobileActiveIdx + 1} / ${totalExamQsCount}`;
    document.getElementById('mobPrevBtn').disabled = (mobileActiveIdx === 0);
    document.getElementById('mobNextBtn').disabled = (mobileActiveIdx === totalExamQsCount - 1);
    
    document.querySelectorAll('.sheet .q').forEach((el) => {
      if (parseInt(el.dataset.qidx) === mobileActiveIdx) { el.classList.add('active-mobile-q'); }
      else { el.classList.remove('active-mobile-q'); }
    });
  } else {
    navBar.style.display = 'none';
    document.querySelectorAll('.sheet .q').forEach((el) => { el.classList.remove('active-mobile-q'); el.style.display = ''; });
  }
}

window.addEventListener('resize', updateMobileQuestionVisibility);

function changeMobileQuestion(dir) {
  let nextIdx = mobileActiveIdx + dir;
  if (nextIdx >= 0 && nextIdx < totalExamQsCount) {
    mobileActiveIdx = nextIdx;
    updateMobileQuestionVisibility();
    document.querySelector('.sheet').scrollIntoView({ behavior: 'smooth', block: 'start' });
  }
}

function actionGradeExam() {
  const dept = document.getElementById('dept').value.trim();
  const empId = document.getElementById('empId').value.trim();
  if(!dept || !empId) return alert('정보를 기입해 주세요.');

  const target = assignedExams.find(a => a.id === activeTakeAssignId);
  let total = 0, maxScore = 0;
  
  document.getElementById('sheet').classList.add('graded');
  document.getElementById('dept').readOnly = true; document.getElementById('empId').readOnly = true;
  isGradedCompleted = true;

  target.questions.forEach((q, idx) => {
    try {
      const pts = q.points || 10; maxScore += pts;
      const qEl = document.querySelector(`.q[data-qidx="${idx}"]`); 
      if(!qEl) return;
      const txtEl = qEl.querySelector('.q-text');
      
      let oldIcon = txtEl.querySelector('.result-icon'); if(oldIcon) oldIcon.remove();
      let icon = document.createElement('span'); icon.className = 'result-icon';
      
      let safeOpts = Array.isArray(q.opts) ? q.opts : [];
      let safeCorrect = Array.isArray(q.correct) ? q.correct : String(q.correct||'').split(',').map(s=>s.trim());

      if((q.type === 'mc' || q.type === 'mc7') && safeOpts.length > 0) {
        let checked = [...qEl.querySelectorAll('input[type=checkbox]:checked')].map(c => c.value);
        
        // 다운로드를 위한 DOM 속성 영구 기록
        qEl.querySelectorAll('input[type=checkbox]').forEach(cb => {
          if(cb.checked) cb.setAttribute('checked', 'checked');
        });
        
        safeCorrect.forEach(v => qEl.querySelector(`input[value="${v}"]`)?.closest('.opt')?.classList.add('correct-mark'));
        checked.forEach(v => { if(!safeCorrect.includes(v)) qEl.querySelector(`input[value="${v}"]`)?.closest('.opt')?.classList.add('wrong-mark'); });
        let isCorrect = checked.length === safeCorrect.length && safeCorrect.every(v => checked.includes(v));
        if(isCorrect) { total += pts; icon.textContent = `✔ 정답`; icon.classList.add('ok'); }
        else { icon.textContent = '✘ 오답'; icon.classList.add('no'); }
      } else {
        let txtInput = qEl.querySelector('input[type=text]');
        if (txtInput) { txtInput.setAttribute('value', txtInput.value); }
        
        let val = (txtInput?.value || '').trim().replace(/\s/g,'').toUpperCase();
        let keywords = (q.keywords || '').split(',').map(k=>k.trim().replace(/\s/g,'').toUpperCase()).filter(Boolean);
        let isCorrect = keywords.some(k => val.includes(k));
        
        let rev = document.getElementById(`reveal-${idx}`);
        if(rev) { rev.textContent = `✔ 모범 정답: ${q.display || q.keywords || ''}`; rev.classList.add('show'); }
        
        if(isCorrect) { total += pts; icon.textContent = `✔ 정답`; icon.classList.add('ok'); }
        else { icon.textContent = '✘ 오답'; icon.classList.add('no'); }
      }
      txtEl.appendChild(icon);
    } catch(e){}
  });

  let pass = total >= 70;
  let sb = document.getElementById('scorebox'); sb.style.display = 'block';
  sb.className = 'scorebox ' + (pass ? 'pass' : 'fail');
  sb.innerHTML = `<div>결과: ${total}점 / ${maxScore}점</div>`;
  
  document.getElementById('scoreCell').textContent = total + '점';
  document.getElementById('gradeBtn').disabled = true; 
  document.getElementById('submitBtn').disabled = false;
  
  updateMobileQuestionVisibility();
  sb.scrollIntoView({ behavior: 'smooth', block: 'center' });
}

    .q { margin-bottom:22px; page-break-inside:avoid; display:block !important; }
    .q-text { font-size:13px !important; font-weight:700; margin-bottom:8px; line-height:1.5; color:#000; }
    .q-num { background:#1a4fb4 !important; color:#fff !important; font-size:11px !important; padding:2px 6px !important; border-radius:4px; margin-right:4px; display:inline-block; }
    .choice-box { border:1px solid #cbd5e0 !important; background:#f4f7ff !important; padding:10px !important; font-size:12px !important; font-weight:bold; color:#2d3748 !important;}
    .opt { display:flex; align-items:center; font-size:12.5px !important; margin:4px 0; padding:3px; color:#111; }
    .opt input[type=checkbox] { width:14px; height:14px; }
    .opt span.num { font-weight:bold; margin-right:4px; }
    .opt.correct-mark { background:#c6f6d5 !important; border-radius:4px; color:#22543d !important; font-weight:bold; }
    .opt.wrong-mark { background:#fed7d7 !important; border-radius:4px; color:#742a2a !important; }
    .result-icon { font-size:11px !important; margin-left:4px; padding:1px 5px !important; border-radius:4px; font-weight:bold; }
    .result-icon.ok { color:#22543d !important; background:#c6f6d5 !important; }
    .result-icon.no { color:#742a2a !important; background:#fed7d7 !important; }
    .answer-reveal { margin-top:6px; font-size:12px !important; color:#1a4fb4 !important; font-weight:700; background:#ebf8ff !important; padding:5px !important; border-radius:4px; }
    .blankbox, .shortanswer { border:1px solid #cbd5e0 !important; padding:6px !important; background:#fafbff !important; margin-top:4px; font-size:12.5px !important; }
    .blankbox input[type=text], .shortanswer input[type=text] { background:transparent !important; border:none !important; border-bottom:1px solid #000 !important; font-size:12.5px !important; color:#000 !important; width:120px; }
  </style></head><body>`);
  
  printWindow.document.write(`<div class="sheet">${res.htmlDump}</div>`);
  printWindow.document.write(`</body></html>`);
  printWindow.document.close();
  printWindow.focus();
  setTimeout(() => { printWindow.print(); }, 600);
}
</script>
